# AI Lab: heterogeneous inference stack for Core Ultra 9 185H + RTX 5060 Ti + 96 GB DDR5.
#
# Normally installed and managed by ./install.sh (see docs/INSTALL.md), which
# writes .env and runs this under the ailab.service systemd unit. By hand:
#   cp .env.example .env && host/scripts/gen-env.sh --write .env
#   docker compose up -d        # add anythingllm to COMPOSE_PROFILES in .env for AnythingLLM
#
# Silicon map (see docs/ARCHITECTURE.md):
#   llm-main     RTX 5060 Ti + DDR5 (MoE experts on CPU)  pinned to P-cores
#   llm-aux      Arc iGPU via Vulkan (small helper model)  pinned to E-cores
#   npu-worker   AI Boost NPU (embeddings + Whisper)       pinned to E-cores
#   open-webui   UI / RAG / router                          E-cores

name: ailab

x-aux-cpus: &aux-cpus
  cpuset: ${AUX_CPUSET:?run host/scripts/gen-env.sh}

x-logging: &logging
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "3"}

services:
  llm-main:
    build:
      context: docker/llama-cuda
      args:
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-master}
        CUDA_ARCH: ${CUDA_ARCH:-120}
    image: ailab/llama-cuda:local
    restart: unless-stopped
    <<: *logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Decode threads must all run at P-core speed or every layer waits on the slowest thread.
    cpuset: ${MAIN_CPUSET:?run host/scripts/gen-env.sh}
    ulimits:
      memlock: -1
    volumes: &llama-volumes
      # Everything large lives under MODELS_DIR (the data disk when the installer set one up).
      - ${MODELS_DIR:-./models}:/models
      - ${MODELS_DIR:-./models}/llama.cpp:/root/.cache/llama.cpp
      - ${MODELS_DIR:-./models}/huggingface:/root/.cache/huggingface
    environment: &llama-env
      LLAMA_CACHE: /root/.cache/llama.cpp
      HF_TOKEN: ${HF_TOKEN:-}
    # -ngl 999 puts every layer's attention/norms/KV on the GPU; --n-cpu-moe N
    # then keeps the expert FFN weights of the first N layers in system RAM.
    # For dense models --n-cpu-moe is a no-op: lower -ngl instead.
    command: >-
      ${MAIN_MODEL_ARGS:?set MAIN_MODEL_ARGS in .env}
      --alias main
      --host 0.0.0.0 --port 8080
      --n-gpu-layers ${MAIN_NGL:-999}
      --n-cpu-moe ${MAIN_N_CPU_MOE:-0}
      --ctx-size ${MAIN_CTX:-32768}
      --threads ${MAIN_THREADS:-6}
      --threads-batch ${MAIN_THREADS_BATCH:-12}
      --parallel ${MAIN_PARALLEL:-1}
      --jinja
      ${MAIN_EXTRA_ARGS:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8081:8080"

  llm-aux:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_VULKAN_TAG:-server-vulkan}
    restart: unless-stopped
    <<: [*aux-cpus, *logging]
    # Only the Intel render node is mapped, so Vulkan can't pick the NVIDIA card.
    devices:
      - ${INTEL_RENDER_NODE:-/dev/dri/renderD128}:/dev/dri/renderD128
    group_add:
      - "${RENDER_GID:?run host/scripts/gen-env.sh}"
    volumes: *llama-volumes
    environment: *llama-env
    command: >-
      ${AUX_MODEL_ARGS:?set AUX_MODEL_ARGS in .env}
      --alias aux
      --host 0.0.0.0 --port 8080
      --n-gpu-layers 999
      --ctx-size ${AUX_CTX:-16384}
      --parallel ${AUX_PARALLEL:-2}
      --jinja
      ${AUX_EXTRA_ARGS:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:8080"

  npu-worker:
    build:
      context: services/npu-worker
      args:
        NPU_DRIVER_TAG: ${NPU_DRIVER_TAG:-latest}
        INTEL_GPU_PPA: ${INTEL_GPU_PPA:-ppa:kobuk-team/intel-graphics}
        WITH_EXPORTER: ${NPU_WITH_EXPORTER:-1}
    image: ailab/npu-worker:local
    restart: unless-stopped
    <<: [*aux-cpus, *logging]
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
    group_add:
      - "${RENDER_GID:?run host/scripts/gen-env.sh}"
    volumes:
      - ${MODELS_DIR:-./models}/openvino:/models
      - ${MODELS_DIR:-./models}/huggingface:/root/.cache/huggingface
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-base-en-v1.5}
      EMBED_POOLING: ${EMBED_POOLING:-cls}
      EMBED_DEVICES: ${EMBED_DEVICES:-NPU,CPU}
      EMBED_MAX_LENGTH: ${EMBED_MAX_LENGTH:-512}
      STT_MODEL: ${STT_MODEL:-openai/whisper-base}
      STT_DEVICES: ${STT_DEVICES:-NPU,CPU}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8083:8000"

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-main}
    restart: unless-stopped
    <<: [*aux-cpus, *logging]
    depends_on: [llm-main, llm-aux, npu-worker]
    volumes:
      - open-webui:/app/backend/data
    environment:
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URLS: http://llm-main:8080/v1;http://llm-aux:8080/v1
      OPENAI_API_KEYS: "none;none"
      # RAG embeddings -> NPU
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://npu-worker:8000/v1
      RAG_OPENAI_API_KEY: none
      RAG_EMBEDDING_MODEL: embed
      # Speech-to-text -> NPU
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://npu-worker:8000/v1
      AUDIO_STT_OPENAI_API_KEY: none
      AUDIO_STT_MODEL: whisper
      # Titles, tags, search queries -> iGPU model, keeps the big model free
      TASK_MODEL_EXTERNAL: aux
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
    ports:
      - "${WEBUI_BIND_ADDR:-0.0.0.0}:${WEBUI_PORT:-3000}:8080"

  anythingllm:
    profiles: [anythingllm]
    image: mintplexlabs/anythingllm:${ANYTHINGLLM_TAG:-latest}
    restart: unless-stopped
    <<: [*aux-cpus, *logging]
    depends_on: [llm-main, npu-worker]
    cap_add: [SYS_ADMIN]
    volumes:
      - anythingllm:/app/server/storage
    environment:
      STORAGE_DIR: /app/server/storage
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: http://llm-main:8080/v1
      GENERIC_OPEN_AI_MODEL_PREF: main
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: ${MAIN_CTX:-32768}
      GENERIC_OPEN_AI_API_KEY: none
      EMBEDDING_ENGINE: generic-openai
      EMBEDDING_BASE_PATH: http://npu-worker:8000/v1
      EMBEDDING_MODEL_PREF: embed
      GENERIC_OPEN_AI_EMBEDDING_API_KEY: none
      VECTOR_DB: lancedb
    ports:
      - "${WEBUI_BIND_ADDR:-0.0.0.0}:${ANYTHINGLLM_PORT:-3001}:3001"

volumes:
  open-webui:
  anythingllm:
